version: "3.8"

# Production deployment — Docker Swarm
# All secrets loaded from Consul at startup
#
# Deploy: docker stack deploy -c docker-stack.yml turfinn
# Requires: Consul running on host (172.17.0.1:8500)

services:
  # ── Traefik — Reverse Proxy & SSL ──────────────────────────────────────
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - internal
      - public
    deploy:
      placement:
        constraints: [node.role == manager]

  # ── Go API ─────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_USER}/turfinn-api:${TAG:-latest}
    command: ["./turfinn-api"]
    environment:
      CONSUL_URL: http://172.17.0.1:8500
      CONSUL_TOKEN: ${CONSUL_TOKEN}
      CONSUL_PREFIX: turfinn
    networks:
      - internal
      - public
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.turfinn.com`)"
        - "traefik.http.routers.api.tls.certresolver=le"
        - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ── Worker — Async Tasks ───────────────────────────────────────────────
  worker:
    image: ghcr.io/${GITHUB_USER}/turfinn-api:${TAG:-latest}
    command: ["./turfinn-worker"]
    environment:
      CONSUL_URL: http://172.17.0.1:8500
      CONSUL_TOKEN: ${CONSUL_TOKEN}
      CONSUL_PREFIX: turfinn
    networks:
      - internal
    deploy:
      replicas: 2

  # ── Player App (Flutter Web) ───────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_USER}/turfinn-app:${TAG:-latest}
    networks:
      - internal
      - public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.app.rule=Host(`turfinn.com`) || Host(`www.turfinn.com`)"
        - "traefik.http.routers.app.tls.certresolver=le"
        - "traefik.http.services.app.loadbalancer.server.port=80"

  # ── Turf Manager (Flutter Web) ─────────────────────────────────────────
  manage:
    image: ghcr.io/${GITHUB_USER}/turfinn-manage:${TAG:-latest}
    networks:
      - internal
      - public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.manage.rule=Host(`manage.turfinn.com`)"
        - "traefik.http.routers.manage.tls.certresolver=le"
        - "traefik.http.services.manage.loadbalancer.server.port=80"

  # ── Super Admin (Flutter Web) ──────────────────────────────────────────
  superadmin:
    image: ghcr.io/${GITHUB_USER}/turfinn-superadmin:${TAG:-latest}
    networks:
      - internal
      - public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.superadmin.rule=Host(`admin.turfinn.com`)"
        - "traefik.http.routers.superadmin.tls.certresolver=le"
        - "traefik.http.services.superadmin.loadbalancer.server.port=80"

networks:
  internal:
    driver: overlay
  public:
    driver: overlay

volumes:
  traefik_certs:
