server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html — never cache so new deployments are always picked up
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    # Flutter web's "bootstrap" files have non-fingerprinted names — must
    # revalidate or users keep running the deploy from two weeks ago.
    location = /flutter_bootstrap.js {
        # no-cache (NOT no-store) — browser keeps the file but revalidates.
        # Unchanged ⇒ 304 Not Modified, no body re-download. Fast.
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache images/fonts, but not JS/CSS (Flutter hashes filenames on release builds)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # JS/CSS — short cache so rebuilds take effect quickly
    location ~* \.(js|css)$ {
        expires 1m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
