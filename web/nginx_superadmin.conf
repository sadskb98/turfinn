server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cache policy ──
    # Flutter web's "bootstrap" files have non-fingerprinted names —
    # caching them aggressively means new deploys won't reach users until
    # they manually clear their cache. Revalidate every load instead.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location = /flutter_bootstrap.js {
        # no-cache (NOT no-store) — browser keeps the file but revalidates.
        # Unchanged ⇒ 304 Not Modified, no body re-download. Fast.
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /flutter_service_worker.js {
        # Critical: a stale SW would keep serving stale assets. Revalidate
        # every load so the empty placeholder unregisters old SWs.
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter content-hashes assets in /canvaskit/ and /assets/ — those
    # are safe to cache long-term. Plain image / font requests too.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
